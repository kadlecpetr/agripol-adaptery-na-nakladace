<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Administrace – Adaptéry pro nakladače</title>
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<style>
:root{--accent:#C8191F;--accent-d:#A5131A;--ink:#1F2023;--soft:#5E6168;--line:#E1E2E6;--bg:#F5F6F8;--ok:#1B7F3B;}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2}
.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;display:flex;align-items:center;gap:16px;padding:12px 24px}
.top img{height:38px}
.top__t{font-weight:600;flex:1}
.top .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.top a{color:#fff;opacity:.8;text-decoration:none;font-size:.9rem}
.wrap{max-width:1560px;margin:0 auto;padding:24px 20px 120px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:18px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:.9rem}
.btn:hover{border-color:#bbb}
.btn--p{background:var(--accent);border-color:var(--accent);color:#fff}
.btn--p:hover{background:var(--accent-d);border-color:var(--accent-d)}
.btn--s{padding:5px 10px;font-size:.82rem}
.btn--d{color:var(--accent)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:9px 16px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--soft)}
.tab.is-on{background:#fff;color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.1)}
label{display:block;font-size:.82rem;font-weight:600;color:var(--soft);margin-bottom:4px}
input[type=text],input[type=number],input[type=password],select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(200,25,31,.25);border-color:var(--accent)}
textarea{min-height:90px;resize:vertical}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chk{display:inline-flex;align-items:center;gap:7px;font-weight:500;color:var(--ink);font-size:.92rem;margin:0 14px 6px 0}
.hint{font-size:.82rem;color:var(--soft);margin:4px 0 0}
table{width:100%;border-collapse:collapse}
td:nth-child(4){white-space:nowrap}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;color:var(--soft)}
td img{width:56px;height:42px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:6px}
.sub{margin:22px 0 10px;font-size:1.02rem}
.sublist{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;background:#FAFAFB}
.photos{display:flex;gap:12px;flex-wrap:wrap}
.ph{width:130px;border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;background:#fff}
.ph img{width:100%;height:90px;object-fit:contain}
.ph small{display:block;color:var(--soft);font-size:.72rem}
.ph.is-main{border-color:var(--accent)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:12px 24px;display:flex;gap:14px;align-items:center;justify-content:space-between;box-shadow:0 -4px 20px rgba(0,0,0,.08)}
.msg{font-size:.92rem}
.msg.ok{color:var(--ok)}.msg.err{color:var(--accent)}
.login{max-width:560px;margin:60px auto}
ol.steps{padding-left:20px;color:var(--soft)}
.stav{width:auto;min-width:150px;padding:6px 10px;font-weight:600;font-size:.85rem;cursor:pointer;background:#EEF0F3}
.stav.is-stock{background:#E6F5EB;color:var(--ok);border-color:#BFE3CB}
.badge{white-space:nowrap;display:inline-block;padding:2px 8px;border-radius:99px;font-size:.74rem;font-weight:600;background:#EEF0F3;color:var(--soft)}
.badge--g{background:#E6F5EB;color:var(--ok)}
code{background:#EEF0F3;padding:1px 5px;border-radius:4px;font-size:.85em}
[hidden]{display:none!important}
.tabs{overflow-x:auto}
.tab{white-space:nowrap}
@media(max-width:900px){
  .wrap{padding:16px 12px 150px}
  .card{padding:16px}
  .top{padding:10px 14px;gap:10px}
  .top img{height:32px}
  .top__t{font-size:.9rem}
}
@media(max-width:480px){.top__t{display:none}.top{justify-content:space-between}.top img{height:28px}.tab{padding:8px 11px}}
@media(max-width:980px){
  table,tbody{display:block}
  thead{display:none}
  tbody tr{display:grid;grid-template-columns:64px 1fr;gap:3px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
  tbody td{border:0;padding:0;min-width:0}
  tbody td:nth-child(1){grid-row:1/4}
  tbody td:nth-child(6){grid-column:1/-1;text-align:left!important;white-space:normal!important;padding-top:8px;display:flex;flex-wrap:wrap;gap:6px}
  .bar{flex-direction:column;align-items:stretch;padding:10px 14px;gap:8px;text-align:center}
  .bar .row{justify-content:center}
  .row>input[type=text],.row>select{max-width:none!important;flex:1 1 100%}
  .photos .ph{width:calc(50% - 6px)}
  .login{margin:20px auto}
}

</style>
</head>
<body>
<div class="top">
  <img src="../assets/img/logo-full-white.svg" alt="">
  <span class="top__t">Administrace webu</span>
  <a href="../" target="_blank" rel="noopener">Zobrazit web ↗</a>
  <button class="btn btn--s" id="logout" hidden>Odhlásit</button>
</div>

<main class="wrap" id="app"></main>
<div class="bar" id="bar" hidden>
  <span class="msg" id="msg"></span>
  <span class="row"><button class="btn" id="reload">Zahodit změny</button><button class="btn btn--p" id="save" disabled>Uložit na web</button></span>
</div>

<script>
(() => {
  'use strict';
  const REPO = 'kadlecpetr/agripol-adaptery-na-nakladace', BRANCH = 'main', API = 'https://api.github.com/repos/' + REPO;
  const TK = 'agripol-admin-token';
  const $ = (s, c) => (c || document).querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
  const slug = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const getTok = () => { try { return localStorage.getItem(TK) || ''; } catch (e) { return ''; } };
  const setTok = t => { try { t ? localStorage.setItem(TK, t) : localStorage.removeItem(TK); } catch (e) {} };

  let D = null;               // { SITE, MACHINES, MOUNTS, CATEGORIES, PRODUCTS }
  let headSha = '';           // commit, ze kterého jsme data načetli
  let dirty = false;
  let tab = 'produkty';
  let q = '', fcat = '';
  let edit = null;            // { idx, p, isNew }
  const pending = {};         // nové fotky: název → { big, small, url }

  /* ---------- GitHub API ---------- */
  async function gh(path, opt) {
    const r = await fetch(API + path, Object.assign({ headers: { Authorization: 'Bearer ' + getTok(), Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' } }, opt));
    if (!r.ok) {
      let m = ''; try { m = (await r.json()).message; } catch (e) {}
      const err = new Error(r.status + (m ? ' – ' + m : '')); err.status = r.status; throw err;
    }
    return r.json();
  }
  const utf8 = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\n/g, '')), c => c.charCodeAt(0)));

  async function load() {
    const ref = await gh('/git/ref/heads/' + BRANCH);
    headSha = ref.object.sha;
    const f = await gh('/contents/assets/js/data.js?ref=' + headSha);
    const src = f.content ? utf8(f.content) : await (await fetch(f.download_url)).text();
    D = new Function(src + '\n;return {SITE,MACHINES,MOUNTS,CATEGORIES,PRODUCTS};')();
    dirty = false; edit = null;
  }

  /* ---------- serializace data.js ---------- */
  function serialize() {
    const j = o => JSON.stringify(o, null, 2);
    return `/* =========================================================
   DATA — jediné místo, kde se edituje obsah katalogu
   Soubor generuje administrace (admin/index.html); ruční úpravy jsou možné,
   admin si je při dalším načtení přečte.
   ========================================================= */

/* ---- Firemní údaje ---- */
const SITE = ${j(D.SITE)};

/* ---- Typ stroje, na který se adaptér hodí ---- */
const MACHINES = ${j(D.MACHINES)};

/* ---- Systémy uchycení ---- */
const MOUNTS = ${j(D.MOUNTS)};

/* ---- Kategorie — pořadí tady = pořadí na webu ---- */
const CATEGORIES = ${j(D.CATEGORIES)};

/* ---- Produkty — pořadí v poli = pořadí v katalogu ---- */
const PRODUCTS = [
${D.PRODUCTS.map(p => '  ' + JSON.stringify(p)).join(',\n')}
];
`;
  }

  async function save() {
    const btn = $('#save'); btn.disabled = true; msg('Ukládám…');
    try {
      const cur = await gh('/git/ref/heads/' + BRANCH);
      if (cur.object.sha !== headSha) throw new Error('Web byl mezitím změněn jinde. Zahoďte změny a načtěte data znovu.');
      const used = new Set(); D.PRODUCTS.forEach(p => p.imgs.forEach(f => used.add(f))); D.CATEGORIES.forEach(c => c.img && used.add(c.img));
      const tree = [];
      const blob = async (content, enc) => (await gh('/git/blobs', { method: 'POST', body: JSON.stringify({ content, encoding: enc }) })).sha;
      for (const name of Object.keys(pending)) {
        if (!used.has(name)) continue;
        const ph = pending[name];
        if (ph.big) tree.push({ path: 'assets/img/produkty/' + name, mode: '100644', type: 'blob', sha: await blob(ph.big, 'base64') });
        tree.push({ path: '../assets/img/nahledy/' + name, mode: '100644', type: 'blob', sha: await blob(ph.small, 'base64') });
      }
      tree.push({ path: 'assets/js/data.js', mode: '100644', type: 'blob', sha: await blob(serialize(), 'utf-8') });
      const base = (await gh('/git/commits/' + headSha)).tree.sha;
      const t = await gh('/git/trees', { method: 'POST', body: JSON.stringify({ base_tree: base, tree }) });
      const c = await gh('/git/commits', { method: 'POST', body: JSON.stringify({ message: 'Administrace: úprava katalogu', tree: t.sha, parents: [headSha] }) });
      await gh('/git/refs/heads/' + BRANCH, { method: 'PATCH', body: JSON.stringify({ sha: c.sha }) });
      headSha = c.sha; dirty = false;
      Object.keys(pending).forEach(k => delete pending[k]);
      msg('Uloženo. Změna bude na webu za 1–2 minuty (pak obnovte stránku Ctrl+Shift+R).', 'ok');
    } catch (e) { msg('Uložení se nepovedlo: ' + e.message, 'err'); dirty = true; }
    refreshBar();
  }

  /* ---------- UI pomůcky ---------- */
  function msg(t, cls) { const m = $('#msg'); m.textContent = t || ''; m.className = 'msg ' + (cls || ''); }
  function refreshBar() { $('#save').disabled = !dirty; if (dirty) msg('Máte neuložené změny.'); }
  function touch() { dirty = true; refreshBar(); }
  window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
  const catName = id => (D.CATEGORIES.find(c => c.id === id) || {}).name || id;
  const fmt = n => n == null ? '' : new Intl.NumberFormat('cs-CZ').format(n);
  const imgUrl = f => pending[f] ? pending[f].url : '../assets/img/nahledy/' + f;
  const specsToText = o => Object.entries(o || {}).map(([k, v]) => k + ': ' + v).join('\n');
  const textToSpecs = t => { const o = {}; t.split('\n').forEach(l => { const i = l.indexOf(':'); if (i > 0 && l.slice(i + 1).trim()) o[l.slice(0, i).trim()] = l.slice(i + 1).trim(); }); return o; };
  const numOrNull = v => { v = String(v).replace(/\s/g, '').replace(',', '.'); return v === '' || isNaN(+v) ? null : +v; };

  /* ---------- heslo (token zašifrovaný heslem v admin/key.json) ---------- */
  const b64 = u8 => btoa(String.fromCharCode(...u8));
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function deriveKey(pw, salt) {
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 300000, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }
  async function encryptToken(tok, pw) {
    const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await deriveKey(pw, salt), new TextEncoder().encode(tok)));
    return JSON.stringify({ v: 1, salt: b64(salt), iv: b64(iv), data: b64(ct) });
  }
  async function decryptToken(blob, pw) {
    const ct = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(blob.iv) }, await deriveKey(pw, unb64(blob.salt)), unb64(blob.data));
    return new TextDecoder().decode(ct);
  }
  async function fetchKey() {
    try { const r = await fetch('key.json?t=' + Date.now()); return r.ok ? await r.json() : null; } catch (e) { return null; }
  }
  async function savePassword(pw) {
    const body = { message: 'Administrace: nastavení hesla', branch: BRANCH, content: btoa(await encryptToken(getTok(), pw)) };
    try { body.sha = (await gh('/contents/admin/key.json?ref=' + BRANCH)).sha; } catch (e) {}
    await gh('/contents/admin/key.json', { method: 'PUT', body: JSON.stringify(body) });
    headSha = (await gh('/git/ref/heads/' + BRANCH)).object.sha;
  }

  /* ---------- přihlášení ---------- */
  async function viewLogin(err) {
    $('#bar').hidden = true; $('#logout').hidden = true;
    const key = await fetchKey();
    $('#app').innerHTML = `<div class="card login">
      <h2>Přihlášení do administrace</h2>
      ${key ? `<label for="pw">Heslo</label><input type="password" id="pw" autocomplete="current-password" autofocus>` : `
      <p>Heslo zatím není nastavené. Přihlaste se jednorázově přístupovým klíčem (token) a heslo si pak nastavíte v záložce „Přístup“.</p>
      <label for="tok">Přístupový klíč</label><input type="password" id="tok" autocomplete="off" placeholder="github_pat_…">`}
      ${err ? `<p class="msg err">${esc(err)}</p>` : ''}
      <p><button class="btn btn--p" id="go">Přihlásit</button></p>
      ${key ? `<p><a href="#" id="usetok" class="hint">Přihlásit klíčem místo hesla</a></p>` : `<details><summary>Kde klíč získat (jednorázově)</summary>
        <ol class="steps">
          <li>Přihlaste se na github.com jako majitel repozitáře <code>${REPO.split('/')[0]}</code> a otevřete <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">tento odkaz</a>.</li>
          <li>Token name: <code>admin</code>, Expiration: No expiration (nebo 1 rok), Repository access: <b>Only select repositories</b> → <code>${REPO.split('/')[1]}</code>.</li>
          <li>Repository permissions → <b>Contents: Read and write</b>.</li>
          <li>Generate token, zkopírujte (začíná <code>github_pat_</code>) a vložte sem.</li>
        </ol></details>`}</div>`;
    $('#go').onclick = () => start(key);
    const f = $('#pw') || $('#tok'); f.onkeydown = e => { if (e.key === 'Enter') start(key); };
    const u = $('#usetok'); if (u) u.onclick = e => { e.preventDefault(); const t = prompt('Vložte přístupový klíč (github_pat_…):'); if (t) { setTok(t.trim()); start(null); } };
  }
  async function start(key) {
    const pwEl = $('#pw'), tokEl = $('#tok');
    if (pwEl && key) {
      try { setTok(await decryptToken(key, pwEl.value)); } catch (e) { return viewLogin('Nesprávné heslo.'); }
    } else if (tokEl && tokEl.value.trim()) setTok(tokEl.value.trim());
    if (!getTok()) return viewLogin();
    $('#app').innerHTML = '<p class="card">Načítám data…</p>';
    try { await load(); } catch (e) {
      if (e.status === 401 || e.status === 403 || e.status === 404) { setTok(''); return viewLogin('Přístup nefunguje (' + e.message + '). Zkontrolujte oprávnění klíče.'); }
      return viewLogin('Načtení se nepovedlo: ' + e.message);
    }
    $('#bar').hidden = false; $('#logout').hidden = false; msg(''); refreshBar(); render();
  }
  $('#logout').onclick = () => { if (!dirty || confirm('Neuložené změny se ztratí. Odhlásit?')) { setTok(''); dirty = false; viewLogin(); } };
  $('#save').onclick = save;
  $('#reload').onclick = async () => { if (dirty && !confirm('Zahodit všechny neuložené změny?')) return; Object.keys(pending).forEach(k => delete pending[k]); await load(); msg(''); render(); };

  /* ---------- hlavní zobrazení ---------- */
  function render() {
    if (edit) return renderEdit();
    const tabs = [['produkty', 'Produkty'], ['kategorie', 'Kategorie'], ['firma', 'Firemní údaje'], ['pristup', 'Přístup']];
    $('#app').innerHTML = `<div class="tabs">${tabs.map(t => `<button class="tab${tab === t[0] ? ' is-on' : ''}" data-tab="${t[0]}">${t[1]}</button>`).join('')}</div><div id="pane"></div>`;
    document.querySelectorAll('.tab').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
    ({ produkty: paneProducts, kategorie: paneCats, firma: paneSite, pristup: paneAccess })[tab]();
  }

  /* stav produktu: [název, stock, sale] */
  const STAV = [['Skladem', true, false], ['Na objednávku', false, false], ['Na cestě', false, false], ['Akční cena', false, true]];
  const stavOf = p => p.sale ? 'Akční cena' : p.stock ? 'Skladem' : (p.avail || 'Na objednávku');
  function paneProducts() {
    const list = D.PRODUCTS.map((p, i) => ({ p, i })).filter(x => (!fcat || x.p.cat === fcat) && (!q || x.p.name.toLowerCase().includes(q.toLowerCase())));
    $('#pane').innerHTML = `<div class="card">
      <div class="row" style="margin-bottom:14px">
        <input type="text" id="q" placeholder="Hledat produkt…" value="${esc(q)}" style="max-width:260px">
        <select id="fc" style="max-width:220px"><option value="">Všechny kategorie</option>${D.CATEGORIES.map(c => `<option value="${c.id}"${fcat === c.id ? ' selected' : ''}>${esc(c.name)}</option>`).join('')}</select>
        <span style="flex:1"></span><span class="hint">${list.length} produktů</span>
        <button class="btn btn--p" id="new">+ Nový produkt</button>
      </div>
      <table><thead><tr><th></th><th>Název</th><th>Kategorie</th><th>Cena od</th><th>Stav</th><th></th></tr></thead><tbody>
      ${list.map(({ p, i }) => `<tr>
        <td><img src="${p.imgs[0] ? imgUrl(p.imgs[0]) : '../assets/img/nahledy/_bez-foto.svg'}" alt=""></td>
        <td><b>${esc(p.name)}</b></td><td>${esc(catName(p.cat))}</td>
        <td>${p.price ? fmt(p.price) + ' Kč' : '–'}</td>
        <td><select class="stav${p.stock ? ' is-stock' : ''}" data-st="${i}">${STAV.map(x => `<option${stavOf(p) === x[0] ? ' selected' : ''}>${x[0]}</option>`).join('')}${STAV.some(x => x[0] === stavOf(p)) ? '' : `<option selected>${esc(stavOf(p))}</option>`}</select></td>
        <td style="white-space:nowrap;text-align:right">
          <button class="btn btn--s" data-up="${i}" title="Výš v katalogu">↑</button>
          <button class="btn btn--s" data-dn="${i}" title="Níž v katalogu">↓</button>
          <button class="btn btn--s" data-ed="${i}">Upravit</button>
          <button class="btn btn--s" data-cp="${i}" title="Vytvořit kopii">Kopie</button>
          <button class="btn btn--s btn--d" data-rm="${i}">Smazat</button></td></tr>`).join('')}
      </tbody></table>
      <p class="hint">Pořadí šipkami platí v rámci jedné kategorie (v katalogu se řadí od největšího po nejmenší).</p></div>`;
    $('#q').oninput = e => { q = e.target.value; paneProducts(); const el = $('#q'); el.focus(); el.setSelectionRange(q.length, q.length); };
    $('#fc').onchange = e => { fcat = e.target.value; paneProducts(); };
    $('#new').onclick = () => { edit = { idx: -1, isNew: true, p: blank() }; render(); };
    $('#pane').onchange = e => {
      const el = e.target; if (el.dataset.st == null) return;
      const x = STAV.find(v => v[0] === el.value); if (!x) return;
      const p = D.PRODUCTS[+el.dataset.st];
      p.stock = x[1]; p.sale = x[2]; p.avail = x[0];
      el.classList.toggle('is-stock', x[1]); touch();
    };
    $('#pane').onclick = e => {
      const b = e.target.closest('button[data-ed],button[data-up],button[data-dn],button[data-rm],button[data-cp]'); if (!b) return;
      const d = b.dataset;
      if (d.ed != null) { edit = { idx: +d.ed, isNew: false, p: JSON.parse(JSON.stringify(D.PRODUCTS[+d.ed])) }; render(); }
      else if (d.cp != null) { const c = JSON.parse(JSON.stringify(D.PRODUCTS[+d.cp])); c.name += ' (kopie)'; c.id = uniqueId(slug(c.name)); edit = { idx: -1, isNew: true, p: c }; render(); }
      else if (d.rm != null) { const p = D.PRODUCTS[+d.rm]; if (confirm('Opravdu smazat produkt „' + p.name + '“?')) { D.PRODUCTS.splice(+d.rm, 1); touch(); paneProducts(); } }
      else { const i = +(d.up != null ? d.up : d.dn), dir = d.up != null ? -1 : 1; let j = i + dir;
        while (j >= 0 && j < D.PRODUCTS.length && D.PRODUCTS[j].cat !== D.PRODUCTS[i].cat) j += dir;
        if (j >= 0 && j < D.PRODUCTS.length) { [D.PRODUCTS[i], D.PRODUCTS[j]] = [D.PRODUCTS[j], D.PRODUCTS[i]]; touch(); paneProducts(); } }
    };
  }
  const uniqueId = base => { let id = base || 'produkt', n = 2; while (D.PRODUCTS.some(p => p.id === id)) id = (base || 'produkt') + '-' + n++; return id; };
  const blank = () => ({ id: '', name: '', cat: D.CATEGORIES[0].id, price: null, priceFrom: true, stock: false, sale: false, avail: 'Na objednávku', machines: [], mounts: [], mount: null, mountExtra: null, specs: {}, perex: '', desc: [], variantLabel: '', variants: [], extras: [], drawings: [], imgs: [] });

  /* ---------- editor produktu ---------- */
  function renderEdit() {
    const p = edit.p;
    $('#app').innerHTML = `<div class="card">
      <div class="row" style="margin-bottom:16px"><button class="btn" id="back">← Zpět na seznam</button><h2 style="flex:1">${edit.isNew ? 'Nový produkt' : 'Úprava produktu'}</h2><button class="btn btn--p" id="ok">Hotovo</button></div>
      <div class="grid">
        <div style="grid-column:1/-1"><label>Název produktu</label><input type="text" data-k="name" value="${esc(p.name)}"></div>
        <div><label>Kategorie</label><select data-k="cat">${D.CATEGORIES.map(c => `<option value="${c.id}"${p.cat === c.id ? ' selected' : ''}>${esc(c.name)}</option>`).join('')}</select></div>
        <div><label>Cena v Kč bez DPH${p.variants.length ? ' (bere se z 1. varianty)' : ''}</label><input type="text" data-k="price" data-n="1" value="${p.price == null ? '' : p.price}" ${p.variants.length ? 'disabled' : ''}></div>
        <div><label>Dostupnost (text)</label><input type="text" data-k="avail" value="${esc(p.avail)}" placeholder="Na objednávku / Skladem"></div>
      </div>
      <div style="margin-top:12px">
        <label class="chk"><input type="checkbox" data-k="priceFrom"${p.priceFrom ? ' checked' : ''}> Cena „od“</label>
        <label class="chk"><input type="checkbox" data-k="stock"${p.stock ? ' checked' : ''}> Skladem</label>
        <label class="chk"><input type="checkbox" data-k="sale"${p.sale ? ' checked' : ''}> Akce</label>
      </div>
      <h3 class="sub">Fotky</h3>
      <div class="photos" id="photos">${p.imgs.map((f, i) => `<div class="ph${i ? '' : ' is-main'}"><img src="${imgUrl(f)}" alt=""><small>${i ? '' : 'Hlavní fotka'}</small>
        <button class="btn btn--s" data-pl="${i}" ${i ? '' : 'disabled'} title="Posunout vlevo">←</button> <button class="btn btn--s" data-pr="${i}" ${i < p.imgs.length - 1 ? '' : 'disabled'}>→</button>
        <button class="btn btn--s btn--d" data-pd="${i}">✕</button></div>`).join('')}
        <div class="ph" style="display:flex;align-items:center;justify-content:center"><label class="btn" style="margin:0">+ Přidat fotky<input type="file" id="file" accept="image/*" multiple hidden></label></div>
        <div class="ph" style="display:flex;align-items:center;justify-content:center"><label class="btn" style="margin:0">📷 Vyfotit<input type="file" id="cam" accept="image/*" capture="environment" hidden></label></div></div>
      <p class="hint">Fotky se samy zmenší a převedou. Na telefonu a tabletu tlačítko „Vyfotit“ rovnou otevře foťák (na počítači otevře výběr souboru). Nejlépe na bílém nebo světlém pozadí. První fotka je hlavní.</p>
      <h3 class="sub">Uchycení a stroje</h3>
      <div class="grid">
        <div><label>Uchycení, se kterým platí cena</label><input type="text" data-k="mount" data-nul="1" value="${esc(p.mount || '')}" placeholder="např. EURO, na paletizační vidle"></div>
        <div><label>Příplatek za jiné uchycení (Kč, prázdné = na dotaz)</label><input type="text" data-k="mountExtra" data-n="1" value="${p.mountExtra == null ? '' : p.mountExtra}"></div>
      </div>
      <div style="margin-top:10px"><label>Hodí se na stroje</label>${D.MACHINES.map(m => `<label class="chk"><input type="checkbox" data-mc="${m.id}"${p.machines.includes(m.id) ? ' checked' : ''}> ${esc(m.name)}</label>`).join('')}</div>
      <div><label>Další nabízená uchycení</label>${D.MOUNTS.map(m => `<label class="chk"><input type="checkbox" data-mt="${m.id}"${p.mounts.includes(m.id) ? ' checked' : ''}> ${esc(m.name)}</label>`).join('')}</div>
      <h3 class="sub">Popis</h3>
      <label>Krátký popis (perex)</label><textarea data-k="perex">${esc(p.perex)}</textarea>
      <label style="margin-top:10px">Podrobný popis (každý odstavec na nový řádek)</label><textarea data-k="desc" data-lines="1" style="min-height:130px">${esc(p.desc.join('\n'))}</textarea>
      <label style="margin-top:10px">Parametry (řádek = „Název: hodnota“, např. Šířka: 2,0 m)</label><textarea data-k="specs" data-specs="1">${esc(specsToText(p.specs))}</textarea>
      <h3 class="sub">Varianty (např. šířky) ${p.variants.length ? '' : '<span class="hint">— nepovinné</span>'}</h3>
      <label>Název voleb (např. Šířka, Rozměr)</label><input type="text" data-k="variantLabel" value="${esc(p.variantLabel || '')}" style="max-width:300px">
      <div id="vars" style="margin-top:10px">${p.variants.map((v, i) => `<div class="sublist"><div class="grid">
        <div><label>Kód</label><input type="text" data-l="variants" data-i="${i}" data-f="code" value="${esc(v.code || '')}"></div>
        <div><label>Označení (např. 2,0 m)</label><input type="text" data-l="variants" data-i="${i}" data-f="label" value="${esc(v.label)}"></div>
        <div><label>Cena Kč</label><input type="text" data-l="variants" data-i="${i}" data-f="price" data-n="1" value="${v.price == null ? '' : v.price}"></div></div>
        <label style="margin-top:8px">Parametry varianty (Název: hodnota)</label><textarea data-l="variants" data-i="${i}" data-f="specs" data-specs="1" style="min-height:64px">${esc(specsToText(v.specs))}</textarea>
        <p style="margin:6px 0 0"><button class="btn btn--s btn--d" data-lrm="variants" data-i="${i}">Odebrat variantu</button></p></div>`).join('')}</div>
      <button class="btn btn--s" id="addvar">+ Přidat variantu</button>
      <h3 class="sub">Příplatková výbava</h3>
      <div id="exs">${p.extras.map((x, i) => `<div class="sublist"><div class="grid">
        <div><label>Název</label><input type="text" data-l="extras" data-i="${i}" data-f="name" value="${esc(x.name)}"></div>
        <div><label>Cena Kč</label><input type="text" data-l="extras" data-i="${i}" data-f="price" data-n="1" value="${x.price == null ? '' : x.price}"></div>
        <div><label>Poznámka</label><input type="text" data-l="extras" data-i="${i}" data-f="note" value="${esc(x.note || '')}"></div></div>
        <p style="margin:6px 0 0"><button class="btn btn--s btn--d" data-lrm="extras" data-i="${i}">Odebrat</button></p></div>`).join('')}</div>
      <button class="btn btn--s" id="addex">+ Přidat výbavu</button>
      <p style="margin-top:24px"><button class="btn btn--p" id="ok2">Hotovo</button></p></div>`;
    bindEdit();
  }

  function syncPrice() { if (edit.p.variants.length) edit.p.price = edit.p.variants[0].price; }
  function bindEdit() {
    const p = edit.p, app = $('#app');
    const done = () => {
      if (!p.name.trim()) return alert('Vyplňte název produktu.');
      syncPrice();
      if (edit.isNew) { p.id = uniqueId(slug(p.name)); const last = D.PRODUCTS.map(x => x.cat).lastIndexOf(p.cat); D.PRODUCTS.splice(last + 1, 0, p); }
      else D.PRODUCTS[edit.idx] = p;
      touch(); edit = null; render();
    };
    $('#ok').onclick = $('#ok2').onclick = done;
    $('#back').onclick = () => { if (confirm('Zahodit úpravy tohoto produktu?')) { edit = null; render(); } };
    const valueOf = el => el.type === 'checkbox' ? el.checked : el.value;
    const conv = (el, v) => el.dataset.n ? numOrNull(v) : el.dataset.nul ? (v.trim() || null) : el.dataset.lines ? v.split('\n').map(s => s.trim()).filter(Boolean) : el.dataset.specs ? textToSpecs(v) : v;
    app.oninput = app.onchange = e => {
      const el = e.target; if (el.id === 'file') return;
      if (el.dataset.k) p[el.dataset.k] = conv(el, valueOf(el));
      else if (el.dataset.l) p[el.dataset.l][+el.dataset.i][el.dataset.f] = conv(el, el.value);
      else if (el.dataset.mc) toggle(p.machines, el.dataset.mc, el.checked);
      else if (el.dataset.mt) toggle(p.mounts, el.dataset.mt, el.checked);
    };
    app.onclick = e => {
      const b = e.target.closest('button'); if (!b) return; const d = b.dataset;
      if (b.id === 'addvar') { p.variants.push({ code: '', label: '', price: null, specs: {} }); if (!p.variantLabel) p.variantLabel = 'Šířka'; }
      else if (b.id === 'addex') p.extras.push({ name: '', price: null, note: '' });
      else if (d.lrm) p[d.lrm].splice(+d.i, 1);
      else if (d.pd != null) p.imgs.splice(+d.pd, 1);
      else if (d.pl != null || d.pr != null) { const i = +(d.pl != null ? d.pl : d.pr), j = d.pl != null ? i - 1 : i + 1; [p.imgs[i], p.imgs[j]] = [p.imgs[j], p.imgs[i]]; }
      else return;
      syncPrice(); renderEdit();
    };
    $('#file').onchange = $('#cam').onchange = async e => {
      for (const f of e.target.files) { try { const name = await addPhoto(f, p); p.imgs.push(name); touch(); } catch (er) { alert('Fotku se nepodařilo načíst.'); } }
      renderEdit();
    };
  }
  const toggle = (arr, v, on) => { const i = arr.indexOf(v); if (on && i < 0) arr.push(v); if (!on && i >= 0) arr.splice(i, 1); };

  /* ---------- fotky: zmenšení na 4:3, bílé pozadí, WebP ---------- */
  async function addPhoto(file, p, smallOnly) {
    const bmp = await createImageBitmap(file);
    const make = async (w, h) => {
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h);
      const k = Math.min(w / bmp.width, h / bmp.height) * 0.96, dw = bmp.width * k, dh = bmp.height * k;
      x.imageSmoothingQuality = 'high'; x.drawImage(bmp, (w - dw) / 2, (h - dh) / 2, dw, dh);
      const blob = await new Promise(r => c.toBlob(r, 'image/webp', 0.86));
      const b64 = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(String(fr.result).split(',')[1]); fr.readAsDataURL(blob); });
      return { b64, url: URL.createObjectURL(blob) };
    };
    const name = ((p && p.id) ? p.id : slug((p && p.name) || 'foto') || 'foto') + '-' + Date.now().toString(36) + (smallOnly ? '' : '-' + Object.keys(pending).length) + '.webp';
    const small = await make(500, 375);
    const big = smallOnly ? null : await make(900, 675);
    pending[name] = { small: small.b64, big: big && big.b64, url: small.url };
    return name;
  }

  /* ---------- kategorie ---------- */
  function paneCats() {
    $('#pane').innerHTML = `<div class="card">${D.CATEGORIES.map((c, i) => `<div class="sublist"><div class="row">
      <img src="${c.img ? imgUrl(c.img) : '../assets/img/kategorie-pripravujeme.svg'}" style="width:80px;height:60px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:6px" alt="">
      <div style="flex:1;min-width:220px"><label>Název</label><input type="text" data-c="${i}" data-f="name" value="${esc(c.name)}"></div>
      <div style="flex:2;min-width:260px"><label>Popis</label><input type="text" data-c="${i}" data-f="desc" value="${esc(c.desc)}"></div>
      <div><span class="badge">${D.PRODUCTS.filter(p => p.cat === c.id).length} produktů</span></div>
      <div><label class="btn btn--s" style="margin:0">Fotka<input type="file" accept="image/*" data-cf="${i}" hidden></label>
      <button class="btn btn--s" data-cu="${i}">↑</button><button class="btn btn--s" data-cd="${i}">↓</button>
      <button class="btn btn--s btn--d" data-cx="${i}">Smazat</button></div></div></div>`).join('')}
      <button class="btn" id="addcat">+ Nová kategorie</button></div>`;
    const pane = $('#pane');
    pane.oninput = e => { const el = e.target; if (el.dataset.c != null) { D.CATEGORIES[+el.dataset.c][el.dataset.f] = el.value; touch(); } };
    pane.onchange = async e => { const el = e.target; if (el.dataset.cf != null && el.files[0]) { D.CATEGORIES[+el.dataset.cf].img = await addPhoto(el.files[0], { id: D.CATEGORIES[+el.dataset.cf].id }, true); touch(); paneCats(); } };
    pane.onclick = e => {
      const b = e.target.closest('button'); if (!b) return; const d = b.dataset, C = D.CATEGORIES;
      if (b.id === 'addcat') { const n = prompt('Název nové kategorie:'); if (!n) return; C.push({ id: slug(n), name: n, img: '', desc: '' }); }
      else if (d.cu != null || d.cd != null) { const i = +(d.cu != null ? d.cu : d.cd), j = d.cu != null ? i - 1 : i + 1; if (j < 0 || j >= C.length) return; [C[i], C[j]] = [C[j], C[i]]; }
      else if (d.cx != null) { const c = C[+d.cx]; if (D.PRODUCTS.some(p => p.cat === c.id)) return alert('Kategorie obsahuje produkty. Nejdřív je přesuňte jinam nebo smažte.'); if (!confirm('Smazat kategorii „' + c.name + '“?')) return; C.splice(+d.cx, 1); }
      else return;
      touch(); paneCats();
    };
  }

  /* ---------- firemní údaje ---------- */
  function paneSite() {
    const L = { brand: 'Název webu', claim: 'Podtitulek', phone: 'Telefon', phoneHref: 'Telefon pro odkaz (bez mezer, s +420)', email: 'E-mail', street: 'Ulice', city: 'PSČ a obec', owner: 'Jméno majitele', ico: 'IČO', hours: 'Otevírací doba' };
    $('#pane').innerHTML = `<div class="card"><div class="grid">${Object.keys(D.SITE).map(k => `<div><label>${esc(L[k] || k)}</label><input type="text" data-s="${k}" value="${esc(D.SITE[k])}"></div>`).join('')}</div>
      <p class="hint">Pozor: tyto údaje se na webu načítají z katalogu; texty natvrdo napsané na stránkách (např. v patičce) se tím nemění.</p></div>`;
    $('#pane').oninput = e => { const k = e.target.dataset.s; if (k) { D.SITE[k] = e.target.value; touch(); } };
  }

  /* ---------- přístup (heslo) ---------- */
  function paneAccess() {
    $('#pane').innerHTML = `<div class="card" style="max-width:560px"><h3>Heslo do administrace</h3>
      <p class="hint">Nastavte heslo, kterým se bude klient přihlašovat (místo klíče). Zadejte alespoň 10 znaků — nejlépe delší větu. Heslo můžete kdykoli změnit.</p>
      <label>Nové heslo</label><input type="password" id="p1" autocomplete="new-password">
      <label style="margin-top:10px">Heslo znovu</label><input type="password" id="p2" autocomplete="new-password">
      <p><button class="btn btn--p" id="setpw">Nastavit heslo</button> <span class="msg" id="pwmsg"></span></p></div>`;
    $('#setpw').onclick = async () => {
      const a = $('#p1').value, m = $('#pwmsg');
      if (a.length < 10) { m.className = 'msg err'; m.textContent = 'Heslo je příliš krátké (min. 10 znaků).'; return; }
      if (a !== $('#p2').value) { m.className = 'msg err'; m.textContent = 'Hesla se neshodují.'; return; }
      m.className = 'msg'; m.textContent = 'Ukládám…';
      try { await savePassword(a); m.className = 'msg ok'; m.textContent = 'Heslo nastaveno. Platí od příštího přihlášení (za 1–2 minuty).'; }
      catch (e) { m.className = 'msg err'; m.textContent = 'Nepovedlo se: ' + e.message; }
    };
  }

  /* ---------- start ---------- */
  getTok() ? start(null) : viewLogin();
})();
</script>
